<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 670" role="img" aria-labelledby="title desc">
  <title id="title">光阻圖案與已轉移下層的差別</title>
  <desc id="desc">上圖的藍色目標膜仍完整，灰色光阻可作候選移除對象；下圖的藍色膜已被蝕刻出開口，去除灰色光阻不會補回藍色材料。示意不按比例。</desc>
  <rect width="600" height="670" fill="#f8fafc" rx="12"/>
  <g font-family="sans-serif" font-size="22" fill="#0f172a">
    <text x="30" y="42" font-weight="bold">A：顯影後，下層尚未加工</text>
    <text x="30" y="79">候選回退對象是光阻，不保證可重工</text>
    <rect x="50" y="120" width="180" height="45" fill="#64748b"/>
    <rect x="360" y="120" width="190" height="45" fill="#64748b"/>
    <rect x="50" y="165" width="500" height="55" fill="#0284c7"/>
    <rect x="50" y="220" width="500" height="50" fill="#fde68a" stroke="#92400e"/>
    <text x="92" y="151" fill="#fff">光阻</text>
    <text x="170" y="201" fill="#fff">尚完整的目標膜</text>
    <text x="225" y="254">保留基材</text>
    <text x="30" y="311">去光阻後，仍須確認殘留與下層損傷。</text>
    <line x1="30" y1="339" x2="570" y2="339" stroke="#cbd5e1"/>
    <text x="30" y="380" font-weight="bold">B：蝕刻後，下層已有開口</text>
    <text x="30" y="417">同樣去光阻，不會撤銷下層加工</text>
    <rect x="50" y="453" width="180" height="45" fill="#64748b"/>
    <rect x="360" y="453" width="190" height="45" fill="#64748b"/>
    <rect x="50" y="498" width="180" height="55" fill="#0284c7"/>
    <rect x="360" y="498" width="190" height="55" fill="#0284c7"/>
    <rect x="50" y="553" width="500" height="50" fill="#fde68a" stroke="#92400e"/>
    <text x="92" y="484" fill="#fff">光阻</text>
    <text x="248" y="532" fill="#9f1239">開口</text>
    <text x="225" y="587">保留基材</text>
    <text x="30" y="642">教學假設・非按比例・不代表真實膜系</text>
  </g>
</svg>
