site_name: 從晶圓再生與薄化看懂昇陽
site_description: 由監控晶圓的回用、品質驗收與薄化交付，理解昇陽的服務、產能和公司證據
site_author: Edison Hsieh

theme:
  name: material
  custom_dir: ../overrides
  language: zh-TW
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切換為亮色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切換為深色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

docs_dir: ../docs/psi
site_dir: ../book/psi/html
use_directory_urls: false

extra_css:
  - assets/book-transition.css
  - assets/custom.css
extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/font-init.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  bookshelf_url: ../../../index.html

nav:
  - 導讀: README.md
  - 全書地圖: 00-map.md
  - 一、再生的工件與經濟性:
      - "01 晶圓用途與加工歷史": 01-wafer-roles.md
      - "02 再生閉環": 02-reclaim-loop.md
      - "03 品質與驗收": 03-quality-and-qualification.md
      - "04 回用成本": 04-reuse-economics.md
      - "05 需求與新測試晶圓": 05-demand-and-new-test-wafers.md
  - 二、從服務到公司判讀:
      - "06 薄化服務": 06-thinning-services.md
      - "07 先進材料與證據邊界": 07-advanced-materials.md
      - "08 產能與現金流": 08-capacity-and-cashflow.md
      - "09 昇陽服務證據矩陣": 09-psi-evidence-map.md
      - "10 消息判讀與改判條件": 10-reading-news.md
  - 附錄:
      - "A 來源索引": appendix-sources.md
      - "B 術語表": appendix-glossary.md
      - "C 待查問題": appendix-open-questions.md
      - "D 圖表來源": 99-image-credits.md
