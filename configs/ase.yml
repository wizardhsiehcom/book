site_name: 從封裝測試看懂日月光
site_description: 從裸晶到可出貨封裝，走到 VIPack 平台、集團分工、營運口徑與日月光的公開證據
site_author: Edison Hsieh

theme:
  name: material
  custom_dir: ../overrides
  language: zh-TW
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切換為亮色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切換為深色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

docs_dir: ../docs/ase
site_dir: ../book/ase/html
use_directory_urls: false

extra_css:
  - assets/book-transition.css
  - assets/custom.css
  - stylesheets/external-images.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/font-init.js

markdown_extensions:
  - attr_list
  - admonition
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid

extra:
  bookshelf_url: ../../../index.html

nav:
  - 導讀: README.md
  - 全書地圖: 00-map.md
  - 一、封測是什麼生意:
      - "01 從裸晶到可出貨封裝": 01-osat-value-chain.md
      - "02 新聞裡的「日月光」是哪個主體": 02-group-and-business.md
  - 二、封裝服務與整合:
      - "03 傳統封裝的價值基準線": 03-packaging-service-baseline.md
      - "04 SiP 如何把元件變成系統": 04-sip-system-integration.md
      - "05 VIPack 與扇出路線": 05-vipack-and-fanout.md
      - "06 共同設計與交接責任": 06-codesign-and-handoff.md
  - 三、交付、品質與新平台:
      - "07 誰負責判定良品": 07-test-and-quality.md
      - "08 面板級與光電共封裝": 08-emerging-platforms.md
  - 四、營運與公司證據:
      - "09 產能、折舊與獲利橋接": 09-capacity-and-economics.md
      - "10 服務與廠區證據矩陣": 10-ase-service-evidence.md
      - "11 讀懂一則日月光消息": 11-reading-news.md
  - 附錄:
      - "A 來源索引": appendix-sources.md
      - "B 術語表": appendix-glossary.md
      - "C 待查事項": appendix-open-questions.md
      - "D 圖表來源": 99-image-credits.md
