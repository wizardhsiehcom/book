site_name: 程式開發代理的運作原理
site_description: 從工作迴圈、工具、上下文與權限，到多代理分工及平台責任；以論文為基礎的繁體中文教學書。
site_author: Edison Hsieh
theme:
  name: material
  custom_dir: ../overrides
  language: zh-TW
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切換為和紙朱印（淺色）
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切換為墨朱（深色）
  features:
  - navigation.sections
  - navigation.expand
  - navigation.top
  - content.code.copy
docs_dir: ../docs/harness-engineering
site_dir: ../book/harness-engineering/html
use_directory_urls: false
extra:
  bookshelf_url: ../../../index.html
extra_javascript:
- https://unpkg.com/mermaid@10/dist/mermaid.min.js
- assets/mermaid-init.js
- assets/font-init.js
markdown_extensions:
- admonition
- tables
- toc:
    permalink: true
    slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
- pymdownx.details
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_div_format
nav:
- 導讀: README.md
- 一、建立全貌:
  - 01 模型如何接上實際工作: 01-model-and-harness.md
  - 02 研究能證明什麼: 02-reading-evidence.md
- 二、讓工作可靠前進:
  - 03 用工具結果決定下一步: 03-agent-loop.md
  - 04 何時停止，何時算完成: 04-stop-conditions.md
  - 05 接好模型與工具: 05-model-integration.md
  - 06 寫清工具的輸入與結果: 06-tool-contracts.md
  - 07 確認位置再修改檔案: 07-file-editing.md
- 三、找資料與保留狀態:
  - 08 找出需要的程式碼: 08-code-retrieval.md
  - 09 對話放不下時保留什麼: 09-context-compaction.md
  - 10 哪些知識留到下次: 10-persistent-memory.md
- 四、限制與擴充:
  - 11 限制工具能做什麼: 11-permissions.md
  - 12 什麼工作值得分工: 12-multi-agent.md
  - 13 缺少的能力接在哪裡: 13-extensibility.md
- 五、做出設計選擇:
  - 進階：依問題組合設計做法: advanced-patterns.md
  - 14 用相同任務比較設計: 14-compare-designs.md
  - 15 別人依賴系統後的責任: 15-platform-turn.md
  - 16 填寫自己的設計卡: 16-design-your-harness.md
- 實驗與解答:
  - 三組小實驗: examples/README.md
  - 練習解答: exercises-and-answers.md
- 查閱資料:
  - 術語表: glossary.md
  - 系統查閱卡: system-cards.md
  - 論文對照索引: paper-map.md
  - 來源說明: sources.md
  - 驗證紀錄: verification.md
extra_css:
- assets/custom.css
- assets/book-palette.css
- stylesheets/book.css
