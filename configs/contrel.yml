site_name: 從設備整合到量產交付看懂東捷
site_description: 從玻璃加工、RDL 檢量測與搬運能力，走到接口驗收、G2C+ 聯盟責任及可追溯的交付證據
site_author: Edison Hsieh

theme:
  name: material
  custom_dir: ../overrides
  language: zh-TW
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切換為亮色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切換為深色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

docs_dir: ../docs/contrel
site_dir: ../book/contrel/html
use_directory_urls: false

extra_css:
  - assets/book-transition.css
  - assets/custom.css
  - stylesheets/external-images.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/font-init.js

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid

extra:
  bookshelf_url: ../../../index.html

nav:
  - 導讀: README.md
  - 全書地圖: 00-map.md
  - 一、從能力走到可驗收:
      - "01 公開產品與能力基線": 01-capability-baseline.md
      - "02 能力遷移的條件與缺口": 02-transfer-gap.md
      - "03 整合接口與驗收": 03-integration-acceptance.md
  - 二、從合作走到公司證據:
      - "04 聯盟責任與交付": 04-alliance-delivery.md
      - "05 產品與合作證據矩陣": 05-contrel-product-evidence.md
      - "06 新聞事件與改判條件": 06-reading-news.md
  - 附錄:
      - "A 來源索引": appendix-sources.md
      - "B 術語表": appendix-glossary.md
      - "C 待查事項": appendix-open-questions.md
      - "D 圖表來源": 99-image-credits.md
