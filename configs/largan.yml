site_name: 從手機鏡頭看懂大立光
site_description: 從光學取捨、精密成形與組裝良率，走到產品組合、財務口徑與大立光的公開證據
site_author: Edison Hsieh

theme:
  name: material
  custom_dir: ../overrides
  language: zh-TW
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切換為亮色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切換為深色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

docs_dir: ../docs/largan
site_dir: ../book/largan/html
use_directory_urls: false

extra_css:
  - assets/book-transition.css
  - assets/custom.css
  - stylesheets/largan.css
extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/font-init.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  bookshelf_url: ../../../index.html

nav:
  - 導讀: README.md
  - 全書地圖: 00-map.md
  - 一、鏡頭是什麼:
      - "01 相機價值鏈與公司位置": 01-camera-value-chain.md
      - "02 光學取捨": 02-optical-tradeoffs.md
      - "03 影像品質與量測": 03-image-quality.md
  - 二、從設計到量產:
      - "04 鏡頭設計與材料": 04-lens-design-materials.md
      - "05 成形製程": 05-molding-process.md
      - "06 組裝良率與合格成本": 06-assembly-yield-cost.md
      - "07 潛望式與致動": 07-telephoto-actuation.md
  - 三、從產品到公司:
      - "08 驗證與競爭": 08-qualification-competition.md
      - "09 商業與財務": 09-business-economics.md
      - "10 新應用": 10-new-applications.md
      - "11 大立光證據矩陣": 11-largan-evidence-map.md
      - "12 消息判讀與改判條件": 12-reading-news.md
  - 附錄:
      - "A 來源索引": appendix-sources.md
      - "B 術語表": appendix-glossary.md
      - "C 待查問題": appendix-open-questions.md
      - "D 圖表來源": 99-image-credits.md
