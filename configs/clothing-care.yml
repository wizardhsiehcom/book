site_name: 衣物照護：從材質、洗滌到去污與保養
site_description: 辨識衣物材質與洗標，建立洗滌、去污、乾燥、維護與收納的家庭照護流程
site_author: Edison Hsieh

theme:
  name: material
  custom_dir: ../overrides
  language: zh-TW
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切換為亮色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切換為深色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

docs_dir: ../docs/clothing-care
site_dir: ../book/clothing-care/html
use_directory_urls: false

extra_css:
  - assets/book-transition.css
  - assets/custom.css
extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/mermaid-init.js
  - assets/font-init.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  bookshelf_url: ../../../index.html

nav:
  - 導讀: README.md
  - 第一部 認識衣物:
      - "01 照護從觀察開始": 01-care-decisions.md
