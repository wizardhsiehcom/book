site_name: 從測試看懂矽格
site_description: 從測試插入點、測試機小時成本、高速與光電共測，走到矽格的服務證據與擴產主張
site_author: Edison Hsieh

theme:
  name: material
  custom_dir: ../overrides
  language: zh-TW
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切換為亮色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切換為深色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

docs_dir: ../docs/sigurd
site_dir: ../book/sigurd/html
use_directory_urls: false

extra_css:
  - assets/book-transition.css
  - assets/custom.css
  - stylesheets/external-images.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/font-init.js

markdown_extensions:
  - attr_list
  - admonition
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid

extra:
  bookshelf_url: ../../../index.html

nav:
  - 導讀: README.md
  - 全書地圖: 00-map.md
  - 一、測試是什麼生意:
      - "01 測試插入點與漏檢流向": 01-test-in-the-flow.md
      - "02 測試時間為什麼就是錢": 02-test-cost-model.md
      - "03 測試單元與精度上限": 03-test-cell.md
  - 二、難測的東西:
      - "04 高速與射頻的量測邊界": 04-high-speed-rf-test.md
      - "05 burn-in 與篩選取捨": 05-burn-in-and-screening.md
      - "06 矽光子與 CPO 光電共測": 06-silicon-photonics-test.md
  - 三、從測試走到公司證據:
      - "07 服務與產能證據矩陣": 07-sigurd-product-evidence.md
      - "08 新聞事件與改判條件": 08-reading-news.md
  - 附錄:
      - "A 來源索引": appendix-sources.md
      - "B 術語表": appendix-glossary.md
      - "C 待查事項": appendix-open-questions.md
      - "D 圖表來源": 99-image-credits.md
