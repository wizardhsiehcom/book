<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>書庫</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/book-hover.css">
  <link rel="stylesheet" href="css/catalog-glass.css">
  <link rel="stylesheet" href="css/samurai.css">
  <link rel="stylesheet" href="css/eclipse-background.css">
  <link rel="stylesheet" href="docs/assets/book-transition.css">
  <style id="book-transition-opt-out" media="not all">
    @view-transition { navigation: none; }
  </style>
  <style>
    @font-face {
      font-family: 'GenWanMin2';
      src: url('docs/assets/fonts/GenWanMin2-R.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'GenWanMin2';
      src: url('docs/assets/fonts/GenWanMin2-SB.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Cubic-11';
      src: url('docs/assets/fonts/Cubic_11.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }

    /* ── 字型套用（套在 .page 而非 body，縮小 reflow 範圍） ── */
    .page.font-mingti       { font-family: 'GenWanMin2', 'Noto Serif TC', serif; }
    .page.font-pixel        { font-family: 'Cubic-11', monospace; }

  </style>
</head>
<body data-background="animated">

  <details class="top-controls">
    <summary>顯示設定</summary>
    <nav class="ctrl-bar" aria-label="角色顯示">
      <span class="ctrl-label">角色</span>
      <button class="ctrl-btn" data-variant="svg">顯示</button>
      <button class="ctrl-btn" data-variant="none">隱藏</button>
    </nav>
    <nav class="ctrl-bar" aria-label="字型">
      <span class="ctrl-label">字型</span>
      <button class="ctrl-btn" data-font="system">系統</button>
      <button class="ctrl-btn" data-font="mingti">明體</button>
      <button class="ctrl-btn" data-font="pixel">像素</button>
    </nav>
    <nav class="ctrl-bar" aria-label="背景">
      <span class="ctrl-label">背景</span>
      <button class="ctrl-btn" data-background-choice="animated">動態</button>
      <button class="ctrl-btn" data-background-choice="static">靜態</button>
      <button class="ctrl-btn" data-background-choice="off">關閉</button>
    </nav>
  </details>

  <div class="eclipse-background" aria-hidden="true">
    <div class="eclipse-aura"></div>
    <div class="eclipse-orbit">
      <div class="eclipse-corona"></div>
      <div class="eclipse-disc"></div>
    </div>
    <div class="eclipse-reading-glow"></div>
    <svg class="eclipse-contours" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" focusable="false">
      <g fill="none" stroke="#ad5855" stroke-width=".7">
        <path d="M-100 770Q210 440 630 690T1700 470"/>
        <path d="M-100 792Q210 458 630 714T1700 486"/>
        <path d="M-100 838Q210 496 630 757T1700 517"/>
        <path d="M-100 894Q210 554 630 812T1700 548"/>
        <path d="M-100 961Q210 612 630 864T1700 584"/>
      </g>
    </svg>
    <div class="eclipse-dust"></div>
    <div class="eclipse-vignette"></div>
  </div>

  <div id="blade" aria-hidden="true"></div>

  <div class="page">
    <header class="poster">
      <div class="samurai-stage" id="samuraiStage" aria-hidden="true">
        <div class="samurai-wrap" id="samuraiWrap">
          <img id="slashStrike" class="slash-frame" src="docs/assets/characters/scarlet-slash/book-keyframe-strike-v14.png" alt="">
          <img id="slashDraw" class="slash-frame" onload="this.classList.add('is-ready')" src="docs/assets/characters/scarlet-slash/book-keyframe-draw-v2.png" alt="" decoding="async">
          <div id="scarletIdle" class="scarlet-motion scarlet-idle" aria-hidden="true">
            <img class="motion-piece hem-lining" style="--x:341;--y:1010;--w:201" src="docs/assets/characters/scarlet-slash/idle-lining-motion.webp" alt="" decoding="async" fetchpriority="low">
            <img class="motion-base" src="docs/assets/characters/scarlet-slash/idle-base-motion.webp" alt="" decoding="async" fetchpriority="low">
            <img class="motion-piece hem-left" style="--x:75;--y:1066;--w:260" src="docs/assets/characters/scarlet-slash/idle-left.webp" alt="" decoding="async" fetchpriority="low">
            <img class="motion-piece hem-right" style="--x:617;--y:869;--w:202" src="docs/assets/characters/scarlet-slash/idle-right.webp" alt="" decoding="async" fetchpriority="low">
            <span class="motion-piece blink-window" style="--x:420;--y:132;--w:89"><img src="docs/assets/characters/scarlet-slash/eye-blink.webp" alt="" decoding="async" fetchpriority="low"></span>
          </div>
          <div id="scarletDrawMotion" class="scarlet-motion scarlet-draw" aria-hidden="true">
            <img class="motion-piece hem-lining" style="--x:343;--y:1028;--w:209" src="docs/assets/characters/scarlet-slash/draw-lining-motion.webp" alt="" decoding="async" fetchpriority="low">
            <img class="motion-base" src="docs/assets/characters/scarlet-slash/draw-base-motion.webp" alt="" decoding="async" fetchpriority="low">
            <img class="motion-piece hem-left" style="--x:78;--y:1081;--w:253" src="docs/assets/characters/scarlet-slash/draw-left-motion.webp" alt="" decoding="async" fetchpriority="low">
            <img class="motion-piece hem-right" style="--x:628;--y:889;--w:219" src="docs/assets/characters/scarlet-slash/draw-right-motion.webp" alt="" decoding="async" fetchpriority="low">
            <span class="motion-piece blink-window" style="--x:427;--y:156;--w:89"><img src="docs/assets/characters/scarlet-slash/eye-blink.webp" alt="" decoding="async" fetchpriority="low"></span>
          </div>
          <img id="imgSvg" data-src="docs/assets/characters/scarlet-slash/book-keyframe-ready-v5.png"
               width="1024" height="1536" alt="" fetchpriority="high">
          <svg class="scarlet-fx" viewBox="0 0 1344 1536" aria-hidden="true" focusable="false">
            <defs>
              <radialGradient id="steel-glow">
                <stop stop-color="#fff6ce" stop-opacity=".92"/>
                <stop offset=".22" stop-color="#f6ce9b" stop-opacity=".62"/>
                <stop offset="1" stop-color="#dc7d56" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="scarlet-wake" x1="0" y1="0" x2="1" y2=".26">
                <stop stop-color="#7e202b" stop-opacity="0"/>
                <stop offset=".32" stop-color="#a02835" stop-opacity=".65"/>
                <stop offset=".74" stop-color="#e45b58" stop-opacity=".92"/>
                <stop offset="1" stop-color="#fff0d1"/>
              </linearGradient>
            </defs>
            <g class="sheath-glint">
              <circle cx="455" cy="667" r="35" fill="url(#steel-glow)"/>
              <path d="M427 694l25-29-9-13 13 11 22-22-19 26 10 14-15-11z" fill="#fff0ce"/>
            </g>
            <g class="strike-wake">
              <path d="M488 708C628 854 943 955 1273 887C996 932 691 831 488 708Z" fill="url(#scarlet-wake)"/>
              <path d="M645 845C801 913 977 935 1124 915C976 931 802 906 645 845Z" fill="#b84849" opacity=".66"/>
              <path d="M771 794Q1044 873 1230 886Q1251 889 1273 887" fill="none" stroke="#fff0d9" stroke-width="4" stroke-linecap="round"/>
            </g>
          </svg>
        </div>
      </div>
      <p class="eyebrow">私人藏書室 <span>／ 閱讀筆記</span></p>
      <h1 class="library-wordmark">
        <img src="docs/assets/wordmarks/library-shu.png" width="1088" height="920" alt="書庫" fetchpriority="high">
        <img class="wordmark-ku" src="docs/assets/wordmarks/library-ku.png" width="1088" height="920" alt="" aria-hidden="true" fetchpriority="high">
        <sup aria-hidden="true">藏</sup>
      </h1>
      <p class="subtitle">字裡，行間。<br>剖開知識的紋理。</p>
      <div class="poster-foot" aria-hidden="true">記錄 · 拆解 · 重讀</div>
    </header>

    <main class="catalog">
      <div class="catalog-heading"><div><p class="eyebrow">閱讀索引</p><h2>選一冊，入內。</h2></div><span class="edition" aria-hidden="true">冊<br>錄</span></div>
      <div class="stats" id="stats"></div>
      <div class="search-tools">
        <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="搜尋書籍" placeholder="搜尋書名、內容、主題" autocomplete="off" spellcheck="false"></div>
      </div>
      <div class="toc-heading"><span>分類 ／ 卷目</span><button type="button" id="category-all" class="category-all" aria-pressed="true"></button></div>
      <nav class="categories" id="categories" aria-label="書籍分類"></nav>
      <div class="index-heading"><span>編號 ／ 書名</span><span id="result-count" role="status"></span></div>
      <div class="grid" id="grid"></div>
      <footer id="footer">閱讀未完，筆記待續。</footer>
    </main>
  </div>

  <script src="js/books-data.js"></script>
  <script src="js/books-app.js"></script>
  <script src="js/catalog-glass.js"></script>
  <script src="js/book-transition.js"></script>
  <script>
    // 儲存偏好失敗不影響入口（例如瀏覽器限制本機檔案儲存）。
    function readPreference(key, fallback) {
      try { return localStorage.getItem(key) || fallback; } catch { return fallback; }
    }
    function savePreference(key, value) {
      try { localStorage.setItem(key, value); } catch { /* 本次選擇仍生效。 */ }
    }

    /* ── 角色切換 ── */
    function applyVariant(v) {
      if (v !== 'none') v = 'svg';
      resetBookTransition();
      const stage  = document.getElementById('samuraiStage');
      const imgSvg = document.getElementById('imgSvg');

      document.body.classList.remove('variant-none', 'variant-svg', 'variant-png');
      document.body.classList.add('variant-' + v);
      // 隱藏角色時連跨頁快照也停用，直接進書，不播放淡入淡出。
      document.getElementById('book-transition-opt-out').media = v === 'none' ? 'all' : 'not all';

      const selectedImage = v === 'svg' ? imgSvg : null;
      if (selectedImage && !selectedImage.hasAttribute('src')) selectedImage.src = selectedImage.dataset.src;

      stage.style.display  = v === 'none' ? 'none' : '';
      imgSvg.style.display = v === 'svg'  ? ''     : 'none';

      document.querySelectorAll('[data-variant]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.variant === v);
        btn.setAttribute('aria-pressed', btn.dataset.variant === v);
      });
      savePreference('bookVariant', v);
    }

    /* ── 字型切換（套在 .page 縮小 reflow 範圍） ── */
    const FONTS = { system: '', mingti: 'font-mingti', pixel: 'font-pixel' };
    const pageEl = document.querySelector('.page');

    function applyFont(f) {
      if (!Object.hasOwn(FONTS, f)) f = 'system';
      Object.values(FONTS).filter(c => c).forEach(c => pageEl.classList.remove(c));
      if (FONTS[f]) pageEl.classList.add(FONTS[f]);

      document.querySelectorAll('[data-font]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.font === f);
        btn.setAttribute('aria-pressed', btn.dataset.font === f);
      });
      savePreference('bookFont', f);
    }

    /* ── 事件綁定 ── */
    document.querySelectorAll('[data-variant]').forEach(btn =>
      btn.addEventListener('click', () => applyVariant(btn.dataset.variant))
    );
    document.querySelectorAll('[data-font]').forEach(btn =>
      btn.addEventListener('click', () => applyFont(btn.dataset.font))
    );

    /* ── 讀取上次選擇 ── */
    applyVariant(readPreference('bookVariant', 'svg'));
    applyFont(readPreference('bookFont', 'mingti'));
  </script>
  <script src="js/eclipse-background.js"></script>
  <script src="js/wordmark-glitch.js"></script>
</body>
</html>
