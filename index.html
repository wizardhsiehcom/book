<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>書庫</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/samurai.css">
  <link rel="stylesheet" href="docs/assets/book-transition.css">
  <style>
    @font-face {
      font-family: 'GenWanMin2';
      src: url('docs/assets/fonts/GenWanMin2-R.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'GenWanMin2';
      src: url('docs/assets/fonts/GenWanMin2-SB.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Cubic-11';
      src: url('docs/assets/fonts/Cubic_11.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }

    /* ── 字型套用（套在 .page 而非 body，縮小 reflow 範圍） ── */
    .page.font-mingti       { font-family: 'GenWanMin2', 'Noto Serif TC', serif; }
    .page.font-pixel        { font-family: 'Cubic-11', monospace; }

  </style>
</head>
<body>

  <details class="top-controls">
    <summary>顯示設定</summary>
    <nav class="ctrl-bar" aria-label="角色顯示">
      <span class="ctrl-label">角色</span>
      <button class="ctrl-btn" data-variant="svg">顯示</button>
      <button class="ctrl-btn" data-variant="none">隱藏</button>
    </nav>
    <nav class="ctrl-bar" aria-label="字型">
      <span class="ctrl-label">字型</span>
      <button class="ctrl-btn" data-font="system">系統</button>
      <button class="ctrl-btn" data-font="mingti">明體</button>
      <button class="ctrl-btn" data-font="pixel">像素</button>
    </nav>
  </details>

  <div class="samurai-stage" id="samuraiStage" aria-hidden="true">
    <div class="samurai-wrap" id="samuraiWrap">
      <img id="imgSvg" data-src="docs/assets/characters/raster/archivist-scarlet.png"
           width="1024" height="1536" alt="" fetchpriority="high">
    </div>
  </div>

  <div id="blade" aria-hidden="true"></div>

  <div class="page">
    <header class="poster">
      <p class="eyebrow">私人藏書室 <span>／ 閱讀筆記</span></p>
      <h1>書<span>庫</span><sup>藏</sup></h1>
      <p class="subtitle">字裡，行間。<br>剖開知識的紋理。</p>
      <div class="poster-foot" aria-hidden="true">記錄 · 拆解 · 重讀</div>
    </header>

    <main class="catalog">
      <div class="catalog-heading"><div><p class="eyebrow">閱讀索引</p><h2>選一冊，入內。</h2></div><span class="edition" aria-hidden="true">冊<br>錄</span></div>
      <div class="stats" id="stats"></div>
      <div class="search-tools">
        <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="搜尋書籍" placeholder="搜尋書名、內容、主題" autocomplete="off" spellcheck="false"></div>
        <select id="filters" aria-label="篩選主題"></select>
      </div>
      <div class="index-heading"><span>編號 ／ 書名</span><span id="result-count" role="status"></span></div>
      <div class="grid" id="grid"></div>
      <footer id="footer">閱讀未完，筆記待續。</footer>
    </main>
  </div>

  <script src="js/books-data.js"></script>
  <script src="js/books-app.js"></script>
  <script src="js/book-transition.js"></script>
  <script>
    // 儲存偏好失敗不影響入口（例如瀏覽器限制本機檔案儲存）。
    function readPreference(key, fallback) {
      try { return localStorage.getItem(key) || fallback; } catch { return fallback; }
    }
    function savePreference(key, value) {
      try { localStorage.setItem(key, value); } catch { /* 本次選擇仍生效。 */ }
    }

    /* ── 角色切換 ── */
    function applyVariant(v) {
      if (v !== 'none') v = 'svg';
      resetBookTransition();
      const stage  = document.getElementById('samuraiStage');
      const imgSvg = document.getElementById('imgSvg');

      document.body.classList.remove('variant-none', 'variant-svg', 'variant-png');
      document.body.classList.add('variant-' + v);

      const selectedImage = v === 'svg' ? imgSvg : null;
      if (selectedImage && !selectedImage.hasAttribute('src')) selectedImage.src = selectedImage.dataset.src;

      stage.style.display  = v === 'none' ? 'none' : '';
      imgSvg.style.display = v === 'svg'  ? ''     : 'none';

      document.querySelectorAll('[data-variant]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.variant === v);
        btn.setAttribute('aria-pressed', btn.dataset.variant === v);
      });
      savePreference('bookVariant', v);
    }

    /* ── 字型切換（套在 .page 縮小 reflow 範圍） ── */
    const FONTS = { system: '', mingti: 'font-mingti', pixel: 'font-pixel' };
    const pageEl = document.querySelector('.page');

    function applyFont(f) {
      if (!Object.hasOwn(FONTS, f)) f = 'system';
      Object.values(FONTS).filter(c => c).forEach(c => pageEl.classList.remove(c));
      if (FONTS[f]) pageEl.classList.add(FONTS[f]);

      document.querySelectorAll('[data-font]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.font === f);
        btn.setAttribute('aria-pressed', btn.dataset.font === f);
      });
      savePreference('bookFont', f);
    }

    /* ── 事件綁定 ── */
    document.querySelectorAll('[data-variant]').forEach(btn =>
      btn.addEventListener('click', () => applyVariant(btn.dataset.variant))
    );
    document.querySelectorAll('[data-font]').forEach(btn =>
      btn.addEventListener('click', () => applyFont(btn.dataset.font))
    );

    /* ── 讀取上次選擇 ── */
    applyVariant(readPreference('bookVariant', 'svg'));
    applyFont(readPreference('bookFont', 'system'));
  </script>
</body>
</html>
